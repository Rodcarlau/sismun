<th:block th:fragment="content">
<div class="card border-0 mb-3"><div class="card-body"><h5>Total consolidado por tipo de munição</h5><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Tipo</th><th>Físico</th><th>Reservado</th><th>Disponível</th></tr></thead><tbody><tr th:each="t:${totaisConsolidados}"><td th:text="${t.tipoMunicao}"></td><td th:text="${t.quantidadeAtual}"></td><td th:text="${t.quantidadeReservada}"></td><td th:text="${t.quantidadeDisponivel}"></td></tr></tbody></table></div></div></div>
<div class="d-flex justify-content-between mb-3"><h2>Estoque</h2><a class="btn btn-primary" th:href="@{/estoque/novo}">Novo estoque</a></div>
<ul class="nav nav-tabs"><li class="nav-item" th:each="p,s:${paiols}"><button class="nav-link" th:classappend="${s.first}?' active'" data-bs-toggle="tab" th:data-bs-target="${'#paiol-'+p.id}" type="button" th:text="${p.nome}"></button></li></ul>
<div class="tab-content border border-top-0 p-3"><div class="tab-pane fade" th:each="p,s:${paiols}" th:classappend="${s.first}?' show active'" th:id="${'paiol-'+p.id}"><div class="accordion" th:id="${'oms-paiol-'+p.id}"><div class="accordion-item" th:each="om:${omsPorPaiol[p.id]}"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#paiol-'+p.id+'-om-'+om.id}" th:text="${om.sigla+' — '+om.nome}"></button></h2><div class="accordion-collapse collapse" th:id="${'paiol-'+p.id+'-om-'+om.id}"><div class="accordion-body table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Tipo de munição</th><th>Lote</th><th>Virola</th><th>Físico</th><th>Reservado</th><th>Disponível</th><th>Ações</th></tr></thead><tbody><tr th:each="e:${estoques}" th:if="${e.paiol.id == p.id && e.loteMunicao.organizacaoProprietaria.id == om.id}"><td th:text="${e.loteMunicao.municao.tipoMunicao.nome}"></td><td th:text="${e.loteMunicao.lote}"></td><td th:text="${e.loteMunicao.virola}"></td><td th:text="${e.quantidadeAtual}"></td><td th:text="${e.quantidadeReservada}"></td><td th:text="${e.quantidadeDisponivel}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/estoque/{id}/editar(id=${e.id})}">Alterar</a></td></tr></tbody></table></div></div></div><div class="text-muted" th:if="${#lists.isEmpty(omsPorPaiol[p.id])}">Nenhum estoque neste paiol.</div></div></div></div>
</th:block>
