<th:block th:fragment="content"><div class="page-header d-flex justify-content-between"><h2 th:text="${estoque.id == null ? 'Novo estoque' : 'Alterar estoque'}">Estoque</h2><a class="btn btn-outline-secondary" th:href="@{/estoque}">Voltar</a></div><div class="card page-card border-0"><div class="card-body"><form th:action="@{/estoque}" th:object="${estoque}" method="post" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{versao}"><input type="hidden" th:field="*{dataEntrada}"><div class="col-md-5"><label class="form-label">Paiol</label><select class="form-select" th:field="*{paiol}" required><option th:each="p : ${paiols}" th:value="${p.id}" th:text="${p.nome}"></option></select></div><div class="col-md-5"><label class="form-label">Lote / Virola / Tipo</label><select class="form-select" th:field="*{loteMunicao}" required><option th:each="l : ${lotes}" th:value="${l.id}" th:text="${l.lote + ' | ' + l.virola + ' | ' + l.municao.tipoMunicao.nome}"></option></select></div><div class="col-md-2"><label class="form-label">Quantidade</label><input type="number" min="0" class="form-control" th:field="*{quantidadeAtual}" required></div><div class="col-12"><button class="btn btn-primary">Salvar</button></div></form></div></div></th:block>
