<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Devoluções</title></head>
<body><th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-3"><h2 class="mb-0">Devoluções</h2></div>
<ul class="nav nav-tabs mb-3" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#painel-pendente" type="button">PENDENTE</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#painel-finalizada" type="button">FINALIZADA</button></li></ul>
<div class="tab-content">
<div th:each="statusAba : ${ {'PENDENTE','FINALIZADA'} }" class="tab-pane fade" th:classappend="${statusAba == 'PENDENTE' ? 'show active' : ''}" th:id="${statusAba == 'PENDENTE' ? 'painel-pendente' : 'painel-finalizada'}">
<div class="accordion">
<div class="accordion-item mb-2" th:each="devolucao : ${devolucoes}" th:if="${devolucao.status == statusAba}">
<h2 class="accordion-header" th:id="${'cabecalho-devolucao-' + devolucao.id}"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#conteudo-devolucao-' + devolucao.id}" aria-expanded="false"><strong th:text="${'DIEx: ' + (devolucao.movimentacao != null ? devolucao.movimentacao.diex : '-')}">DIEx</strong><span class="badge bg-warning text-dark ms-3" th:text="${devolucao.status}"></span><span class="text-muted ms-3" th:text="${devolucao.dataDevolucao != null ? #temporals.format(devolucao.dataDevolucao,'dd/MM/yyyy') : '-'}"></span></button></h2>
<div class="accordion-collapse collapse" th:id="${'conteudo-devolucao-' + devolucao.id}" th:aria-labelledby="${'cabecalho-devolucao-' + devolucao.id}"><div class="accordion-body">
<div class="row g-3 mb-3"><div class="col-md-6"><strong>Motivo da retirada:</strong> <span th:text="${devolucao.movimentacao != null && devolucao.movimentacao.motivoRetirada != null ? devolucao.movimentacao.motivoRetirada : '-'}"></span></div><div class="col-md-6"><strong>OM Solicitante:</strong> <span th:text="${devolucao.movimentacao != null && devolucao.movimentacao.omSolicitante != null ? devolucao.movimentacao.omSolicitante.sigla : '-'}"></span></div></div>
<div class="mb-3"><h6>Material entregue</h6><div class="small mb-1" th:each="i : ${itensPorDevolucao[devolucao.id]}"><strong th:text="${'Paiol: ' + (paiolOrigemPorItem[i.itemMovimentacao.id] != null ? paiolOrigemPorItem[i.itemMovimentacao.id] : '-')}"></strong><span th:text="${' | ' + i.itemMovimentacao.loteMunicao.municao.tipoMunicao.nome + ' / ' + i.itemMovimentacao.loteMunicao.municao.calibre + ' | Lote: ' + i.itemMovimentacao.loteMunicao.lote + ' | Virola: ' + i.itemMovimentacao.loteMunicao.virola + ' | Entregue: ' + i.itemMovimentacao.quantidadeEntregue}"></span></div></div>
<div class="row g-4"><div class="col-lg-6">
<form th:if="${!#lists.isEmpty(itensPorDevolucao[devolucao.id].?[!consumoProcessado])}" method="post" th:action="@{/devolucoes/{id}/consumo(id=${devolucao.id})}" onsubmit="return confirm('Confirma o consumo informado?')"><h6>Consumo</h6><div th:each="i : ${itensPorDevolucao[devolucao.id]}" th:if="${!i.consumoProcessado}" class="mb-2"><input type="hidden" name="itemDevolucaoId" th:value="${i.id}"><label class="form-label small"><strong th:text="${'Paiol: ' + (paiolOrigemPorItem[i.itemMovimentacao.id] != null ? paiolOrigemPorItem[i.itemMovimentacao.id] : '-')}"></strong><span th:text="${' | ' + i.itemMovimentacao.loteMunicao.municao.tipoMunicao.nome + ' | Lote: ' + i.itemMovimentacao.loteMunicao.lote + ' | Virola: ' + i.itemMovimentacao.loteMunicao.virola}"></span></label><input type="number" min="0" th:max="${i.itemMovimentacao.quantidadeEntregue - i.quantidadeDevolvida}" value="0" name="quantidadeConsumida" class="form-control form-control-sm" required></div><button class="btn btn-sm btn-primary">Registrar consumo</button></form>
<div th:if="${#lists.isEmpty(itensPorDevolucao[devolucao.id].?[!consumoProcessado])}" class="small text-success">Consumo registrado.</div>
</div><div class="col-lg-6">
<form th:if="${!#lists.isEmpty(itensPorDevolucao[devolucao.id].?[!devolucaoProcessada])}" method="post" enctype="multipart/form-data" th:action="@{/devolucoes/{id}/devolucao(id=${devolucao.id})}" onsubmit="return confirm('Confirma a devolução informada?')"><h6>Devolução</h6><div th:each="i : ${itensPorDevolucao[devolucao.id]}" th:if="${!i.devolucaoProcessada}" class="mb-2"><input type="hidden" name="itemDevolucaoId" th:value="${i.id}"><label class="form-label small"><strong th:text="${'Paiol: ' + (paiolOrigemPorItem[i.itemMovimentacao.id] != null ? paiolOrigemPorItem[i.itemMovimentacao.id] : '-')}"></strong><span th:text="${' | ' + i.itemMovimentacao.loteMunicao.municao.tipoMunicao.nome + ' | Lote: ' + i.itemMovimentacao.loteMunicao.lote + ' | Virola: ' + i.itemMovimentacao.loteMunicao.virola}"></span></label><input type="number" min="0" th:max="${i.itemMovimentacao.quantidadeEntregue - i.quantidadeConsumida}" value="0" name="quantidadeDevolvida" class="form-control form-control-sm" required></div><input name="observacao" class="form-control form-control-sm mt-1" placeholder="Observação"><input type="file" name="arquivo" class="form-control form-control-sm mt-1"><button class="btn btn-sm btn-success mt-1">Registrar devolução</button></form>
<div th:if="${#lists.isEmpty(itensPorDevolucao[devolucao.id].?[!devolucaoProcessada])}" class="small text-success">Devolução registrada.</div><a th:if="${devolucao.anexoNome != null}" th:href="@{/devolucoes/{id}/anexo(id=${devolucao.id})}" th:text="${devolucao.anexoNome}"></a>
</div></div>
</div></div></div></div></div></div></div>
<select id="paiols-devolucao" hidden><option value="">Selecione o paiol de devolução</option><option th:each="p : ${paiols}" th:value="${p.id}" th:text="${p.nome + ' — ' + p.organizacaoMilitar.sigla}"></option></select>
<script>document.addEventListener('DOMContentLoaded',()=>{const modelo=document.getElementById('paiols-devolucao');document.querySelectorAll('form[action$="/devolucao"] input[name="quantidadeDevolvida"]').forEach(q=>{const s=modelo.cloneNode(true);s.removeAttribute('id');s.removeAttribute('hidden');s.name='paiolDestinoId';s.className='form-select form-select-sm mt-1';s.required=true;q.insertAdjacentElement('afterend',s)});});</script>
</th:block></body></html>
