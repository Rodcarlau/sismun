<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center page-header">
        <div>
            <h2 class="mb-1">Nova munição</h2>
            <p class="text-muted mb-0">Cadastro de munição e tipo associado.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/municoes}">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>

    <div class="card page-card border-0">
        <div class="card-body">
            <form th:action="@{/municoes}" th:object="${municao}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-4">
                    <label class="form-label">Tipo</label>
                    <select class="form-select" th:field="*{tipoMunicao}">
                        <option value="">Selecione...</option>
                        <option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nome}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Calibre</label>
                    <input type="text" class="form-control" th:field="*{calibre}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fabricante</label>
                    <input type="text" class="form-control" th:field="*{fabricante}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-control" rows="4" th:field="*{descricao}" required></textarea>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input" type="checkbox" th:field="*{ativo}" checked>
                        <label class="form-check-label">Ativa</label>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</th:block>
