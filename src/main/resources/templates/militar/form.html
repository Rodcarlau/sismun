<th:block th:fragment="content"><div class="page-header d-flex justify-content-between"><h2 th:text="${militar.id == null ? 'Novo militar' : 'Alterar militar'}">Militar</h2><a class="btn btn-outline-secondary" th:href="@{/militares}">Voltar</a></div><div class="card page-card border-0"><div class="card-body"><form th:action="@{/militares}" th:object="${militar}" method="post" class="row g-3"><input type="hidden" th:field="*{id}"><div class="col-md-6"><label class="form-label">Nome completo</label><input class="form-control" th:field="*{nomeCompleto}" required></div><div class="col-md-3"><label class="form-label">Identidade</label><input class="form-control" th:field="*{identidade}" required></div><div class="col-md-3"><label class="form-label">Posto/Graduação</label><select class="form-select" th:field="*{postoGraduacao}" required><option th:each="p : ${postos}" th:value="${p}" th:text="${p.descricao}"></option></select></div><div class="col-md-3"><label class="form-label">Função</label><select class="form-select" th:field="*{funcao}"><option value="">Função não informada</option><option th:each="f : ${funcoes}" th:value="${f}" th:text="${f.descricao}"></option></select></div><div class="col-md-6"><label class="form-label">OM</label><select class="form-select" th:field="*{organizacaoMilitar}" required><option th:each="om : ${organizacoes}" th:value="${om.id}" th:text="${om.nome}"></option></select></div><div class="col-md-6"><label class="form-label">Seção</label><input class="form-control" th:field="*{secao}"></div><div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" th:field="*{telefone}"></div><div class="col-md-6"><label class="form-label">E-mail</label><input type="email" class="form-control" th:field="*{email}"></div><div class="col-md-2"><label>Ativo</label><input class="form-check-input ms-2" type="checkbox" th:field="*{ativo}"></div><div class="col-12"><button class="btn btn-primary">Salvar</button></div></form></div></div></th:block>
