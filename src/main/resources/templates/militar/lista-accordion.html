<th:block th:fragment="content"><div class="d-flex justify-content-between align-items-center mb-3"><h2>Militares</h2><a class="btn btn-primary" th:href="@{/militares/novo}">Novo militar</a></div><div class="accordion" id="militares-por-om"><div class="accordion-item" th:each="om:${organizacoesMilitares}"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#om-'+om.id}" th:text="${om.sigla+' — '+om.nome}"></button></h2><div class="accordion-collapse collapse" th:id="${'om-'+om.id}"><div class="accordion-body table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Nome</th><th>Identidade</th><th>Posto/Graduação</th><th>Seção</th><th>Função</th><th>Ações</th></tr></thead><tbody><tr th:each="militar:${militares}" th:if="${militar.organizacaoMilitar != null && militar.organizacaoMilitar.id == om.id}"><td th:text="${militar.nomeCompleto}"></td><td th:text="${militar.identidade}"></td><td th:text="${militar.postoGraduacao.descricao}"></td><td th:text="${militar.secao}"></td><td th:text="${militar.funcao != null ? militar.funcao.descricao : 'Função não informada'}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/militares/{id}/editar(id=${militar.id})}">Alterar</a></td></tr></tbody></table></div></div></div></div></th:block>
