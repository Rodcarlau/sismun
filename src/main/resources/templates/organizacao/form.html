<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center page-header">
        <div>
            <h2 class="mb-1">Nova organização</h2>
            <p class="text-muted mb-0">Cadastro de organização militar.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/organizacoes}">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>

    <div class="card page-card border-0">
        <div class="card-body">
            <form th:action="@{/organizacoes}" th:object="${organizacao}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sigla</label>
                    <input type="text" class="form-control" th:field="*{sigla}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control" th:field="*{codigo}" required readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cidade</label>
                    <input type="text" class="form-control" th:field="*{cidade}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">UF</label>
                    <input type="text" class="form-control text-uppercase" th:field="*{uf}" maxlength="2">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input" type="checkbox" th:field="*{ativa}" checked>
                        <label class="form-check-label">Ativa</label>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</th:block>
