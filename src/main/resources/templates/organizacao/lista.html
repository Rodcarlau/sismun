<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center page-header">
        <div>
            <h2 class="mb-1">Organizações Militares</h2>
            <p class="text-muted mb-0">Gerenciamento das organizações vinculadas ao sistema.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/organizacoes/novo}">
            <i class="bi bi-plus-lg me-1"></i>Nova organização
        </a>
    </div>

    <div class="card page-card border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Sigla</th>
                        <th>Código</th>
                        <th>Cidade</th>
                        <th>UF</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="organizacao : ${organizacoes}">
                        <td th:text="${organizacao.nome}">-</td>
                        <td th:text="${organizacao.sigla}">-</td>
                        <td th:text="${organizacao.codigo}">-</td>
                        <td th:text="${organizacao.cidade}">-</td>
                        <td th:text="${organizacao.uf}">-</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/organizacoes/{id}/editar(id=${organizacao.id})}"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(organizacoes)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhuma organização cadastrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
