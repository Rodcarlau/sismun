<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center page-header">
        <div><h2 class="mb-1">Nova movimentação</h2><p class="text-muted mb-0">Registre os dados da solicitação.</p></div>
        <a class="btn btn-outline-secondary" th:href="@{/movimentacoes}">Voltar</a>
    </div>
    <div class="card page-card border-0"><div class="card-body">
        <form th:action="@{/movimentacoes}" th:object="${movimentacao}" method="post" enctype="multipart/form-data" class="row g-3">
            <input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{status}">
            <div class="col-12"><label class="form-label">EB</label><input class="form-control" th:field="*{eb}" maxlength="100"/></div>
            <div class="col-md-6"><label class="form-label">DIEX</label><input class="form-control" th:field="*{diex}" required maxlength="100"/></div>
            <div class="col-md-3"><label class="form-label">Data da solicitação</label><input type="date" class="form-control" th:field="*{dataSolicitacao}"/></div>
            <div class="col-md-3"><label class="form-label">Data da retirada</label><input type="date" class="form-control" th:field="*{dataApanha}" required/></div>
            <div class="col-md-4"><label class="form-label">OM solicitante</label><select class="form-select" th:field="*{omSolicitante}"><option value="">Selecione</option><option th:each="om : ${organizacoes}" th:value="${om.id}" th:text="${om.sigla + ' - ' + om.nome}"></option></select></div>
            <div class="col-md-4"><label class="form-label">Paiol de origem</label><select class="form-select" id="paiol-origem" th:field="*{paiolOrigem}"><option value="">Selecione</option><option th:each="paiol : ${paiols}" th:value="${paiol.id}" th:text="${paiol.nome}"></option></select></div>
            <div class="col-md-4"><label class="form-label">Paiol de destino</label><select class="form-select" id="paiol-destino" th:field="*{paiolDestino}"><option value="">Selecione</option><option th:each="paiol : ${paiols}" th:value="${paiol.id}" th:text="${paiol.nome}"></option></select></div>
            <div class="col-md-4"><label class="form-label">Oficial de Munição solicitante</label><select class="form-select" th:field="*{oficialMunicaoSolicitante}"><option value="">Selecione</option><option th:each="militar : ${militares}" th:value="${militar.id}" th:text="${militar.nomeCompleto}"></option></select></div><div class="col-12"><h6 class="mt-2 mb-0">RESPONSÁVEIS PELOS PAIÓIS</h6></div><div class="col-md-6"><label class="form-label">Militar do Paiol de Retirada</label><select id="militar-retirada" class="form-select" th:field="*{militarPaiolRetirada}"><option value="">Selecione primeiro o paiol de retirada</option><option th:if="${movimentacao.militarPaiolRetirada != null}" th:value="${movimentacao.militarPaiolRetirada.id}" th:text="${movimentacao.militarPaiolRetirada.nomeCompleto}" selected></option></select></div><div class="col-md-6"><label class="form-label">Militar do Paiol de Recebimento</label><select id="militar-recebimento" class="form-select" th:field="*{militarPaiolRecebimento}"><option value="">Selecione primeiro o paiol de recebimento</option><option th:if="${movimentacao.militarPaiolRecebimento != null}" th:value="${movimentacao.militarPaiolRecebimento.id}" th:text="${movimentacao.militarPaiolRecebimento.nomeCompleto}" selected></option></select></div><div class="col-12"><h6 class="mt-2 mb-0">RESPONSÁVEL DA OM DETENTORA</h6></div><div class="col-md-6"><label class="form-label">Oficial de Munição da OM Detentora das Munições</label><select id="oficial-detentora" class="form-select" th:field="*{oficialMunicaoOmDetentora}"><option value="">Selecione primeiro os itens</option><option th:if="${movimentacao.oficialMunicaoOmDetentora != null}" th:value="${movimentacao.oficialMunicaoOmDetentora.id}" th:text="${movimentacao.oficialMunicaoOmDetentora.nomeCompleto}" selected></option></select><div id="erro-detentora" class="form-text text-danger"></div></div>
            <div class="col-12"><label class="form-label">Itens da movimentação</label><div class="row g-2 small fw-semibold mb-1"><div class="col-md-3">Paiol</div><div class="col-md-3">Tipo / calibre</div><div class="col-md-2">Lote</div><div class="col-md-2">Virola</div><div class="col-md-1">Quantidade</div><div class="col-md-1">Ações</div></div><div id="itens-municao">
                <div class="row g-2 mb-2 item-municao" th:if="${movimentacao.id == null}"><input type="hidden" name="itemId" value="0"><div class="col-md-3"><select class="form-select municao-select" required><option value="">Selecione</option><option th:each="m : ${municoes}" th:value="${m.id}" th:text="${m.tipoMunicao.nome + ' — ' + m.calibre}"></option></select></div><div class="col-md-5"><select class="form-select estoque-select" name="estoqueId" required disabled><option value="">Selecione primeiro a munição</option><option th:each="e : ${estoques}" th:value="${e.id}" th:attr="data-municao=${e.loteMunicao.municao.id},data-disponivel=${e.quantidadeDisponivel},data-detentora=${e.loteMunicao.organizacaoProprietaria.id}" th:disabled="${e.quantidadeDisponivel <= 0}" th:text="${e.loteMunicao.lote + ' — Virola: ' + e.loteMunicao.virola + ' — Validade: ' + #temporals.format(e.loteMunicao.dataValidade,'dd/MM/yyyy') + ' — Disponível: ' + e.quantidadeDisponivel}"></option></select></div><div class="col-md-3"><input type="number" min="1" name="quantidadeItem" class="form-control" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger remover-item">Remover</button></div></div>
                <div class="row g-2 mb-2 item-municao" th:each="v : ${itensEdicao}"><input type="hidden" name="itemId" th:value="${v.item.id}"><div class="col-md-3"><select class="form-select municao-select" required><option th:each="m : ${municoes}" th:value="${m.id}" th:selected="${m.id == v.municaoId}" th:text="${m.tipoMunicao.nome + ' — ' + m.calibre}"></option></select></div><div class="col-md-5"><select class="form-select estoque-select" name="estoqueId" required><option th:each="e : ${estoques}" th:value="${e.id}" th:attr="data-municao=${e.loteMunicao.municao.id},data-disponivel=${e.quantidadeDisponivel},data-detentora=${e.loteMunicao.organizacaoProprietaria.id}" th:selected="${e.id == v.estoqueId}" th:disabled="${e.quantidadeDisponivel <= 0 && e.id != v.estoqueId}" th:text="${e.loteMunicao.lote + ' — Virola: ' + e.loteMunicao.virola + ' — Validade: ' + #temporals.format(e.loteMunicao.dataValidade,'dd/MM/yyyy') + ' — Disponível: ' + e.quantidadeDisponivel}"></option></select></div><div class="col-md-3"><input type="number" min="1" name="quantidadeItem" class="form-control" th:value="${v.item.quantidadeSolicitada}" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger remover-item">Remover</button></div></div>
            </div><button type="button" id="adicionar-item" class="btn btn-outline-primary btn-sm">+ Adicionar munição</button><div class="form-text">Cada combinação de munição, lote, virola e paiol pode aparecer somente uma vez.</div></div>
            <div class="col-12"><h6 class="mt-2 mb-0">TRANSPORTE E SEGURANÇA</h6></div><div class="col-md-4"><label class="form-label">Viaturas utilizadas</label><select multiple class="form-select" th:field="*{viaturas}"><option th:each="v : ${viaturas}" th:value="${v.id}" th:text="${v.prefixo + ' - ' + v.placa}"></option></select></div><div class="col-md-4"><label class="form-label">Militares da escolta</label><select id="escoltas" multiple class="form-select" th:field="*{escoltas}"><option th:each="m : ${movimentacao.escoltas}" th:value="${m.id}" th:text="${m.postoGraduacao.descricao + ' — ' + m.nomeCompleto}" selected></option></select></div><div class="col-md-4"><label class="form-label">Motoristas</label><select id="motoristas" multiple class="form-select" th:field="*{motoristas}"><option th:each="m : ${movimentacao.motoristas}" th:value="${m.id}" th:text="${m.postoGraduacao.descricao + ' — ' + m.nomeCompleto}" selected></option></select></div>
            <div class="col-12"><label class="form-label">Anexo da solicitação</label><input type="file" name="arquivo" class="form-control"><a th:if="${movimentacao.anexoNome != null}" th:href="@{/movimentacoes/{id}/anexo(id=${movimentacao.id})}" th:text="${movimentacao.anexoNome}"></a></div>
            <div class="col-12"><label class="form-label">Motivo da retirada</label><input class="form-control" th:field="*{motivoRetirada}" maxlength="255"/></div>
            <div class="col-12"><label class="form-label">Observação</label><textarea class="form-control" rows="3" th:field="*{observacao}" maxlength="500"></textarea></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Salvar movimentação</button></div>
        </form>
    </div></div>
    <script>document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('itens-municao'),b=document.getElementById('adicionar-item');if(!c||!b)return;function filtrar(l){const m=l.querySelector('.municao-select'),e=l.querySelector('.estoque-select'),id=m.value;e.querySelectorAll('option[data-municao]').forEach(o=>{o.hidden=o.dataset.municao!==id});if(![...e.options].some(o=>o.value===e.value&&!o.hidden))e.value='';e.disabled=!id}function ligar(l){l.querySelector('.municao-select').addEventListener('change',()=>filtrar(l));filtrar(l)}c.querySelectorAll('.item-municao').forEach(ligar);b.addEventListener('click',()=>{const l=c.querySelector('.item-municao').cloneNode(true);l.querySelector('[name=itemId]').value='0';l.querySelectorAll('select,input[type=number]').forEach(x=>x.value='');c.appendChild(l);ligar(l)});c.addEventListener('click',e=>{if(e.target.classList.contains('remover-item')){if(c.querySelectorAll('.item-municao').length===1)return alert('A movimentação deve possuir ao menos um item.');e.target.closest('.item-municao').remove()}})});</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const label=m=>`${m.postoGraduacao} — ${m.nomeCompleto} — ${m.funcao} — ${m.organizacao}`;const fill=async(s,url,placeholder)=>{const old=[...s.selectedOptions].map(o=>o.value);s.innerHTML=`<option value="">${placeholder}</option>`;if(!url){s.disabled=true;return;}const data=await fetch(url).then(r=>r.json());s.innerHTML='';data.forEach(m=>{const o=new Option(label(m),m.id);o.selected=old.includes(String(m.id));s.add(o)});s.disabled=false};const po=document.getElementById('paiol-origem'),pd=document.getElementById('paiol-destino'),mr=document.getElementById('militar-retirada'),md=document.getElementById('militar-recebimento'),of=document.getElementById('oficial-detentora'),es=document.getElementById('escoltas'),mo=document.getElementById('motoristas'),erro=document.getElementById('erro-detentora');const paiol=(p,s,n)=>fill(s,p.value?`/api/militares/paiol/${p.value}`:null,`Selecione primeiro o paiol de ${n}`);po.addEventListener('change',()=>paiol(po,mr,'retirada'));pd.addEventListener('change',()=>paiol(pd,md,'recebimento'));paiol(po,mr,'retirada');paiol(pd,md,'recebimento');fill(mo,'/api/militares/motoristas','Nenhum motorista disponível');const detentora=()=>{const ids=[...document.querySelectorAll('.estoque-select')].map(s=>s.selectedOptions[0]?.dataset.detentora).filter(Boolean),u=[...new Set(ids)];erro.textContent=u.length>1?'Os itens pertencem a OMs detentoras diferentes.':'';fill(of,u.length===1?`/api/militares/oficiais-municao/organizacao/${u[0]}`:null,'Selecione primeiro os itens');fill(es,u.length===1?`/api/militares/escolta?organizacaoDetentoraId=${u[0]}`:null,'Selecione primeiro os itens')};document.getElementById('itens-municao').addEventListener('change',e=>{if(e.target.classList.contains('estoque-select'))detentora()});setTimeout(detentora,0)});</script>
<select id="mapa-paiois-estoque" hidden><option th:each="e : ${estoques}" th:value="${e.id}" th:attr="data-paiol=${e.paiol.id}" th:text="${e.paiol.nome}"></option></select>
<select id="mapa-filtro-estoque" hidden><option th:each="e : ${estoques}" th:value="${e.id}" th:attr="data-paiol=${e.paiol.id},data-municao=${e.loteMunicao.municao.id},data-lote=${e.loteMunicao.lote},data-virola=${e.loteMunicao.virola + ' — OM: ' + (e.paiol.principal && e.paiol.omDetentoraMunicao != null ? e.paiol.omDetentoraMunicao.sigla : e.loteMunicao.organizacaoProprietaria.sigla)},data-detentora=${e.paiol.principal && e.paiol.omDetentoraMunicao != null ? e.paiol.omDetentoraMunicao.id : e.loteMunicao.organizacaoProprietaria.id}"></option></select>
<script>document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('itens-municao'),mapa=[...document.querySelectorAll('#mapa-filtro-estoque option')].map(o=>({id:o.value,paiol:o.dataset.paiol,municao:o.dataset.municao,lote:o.dataset.lote,virola:o.dataset.virola||''}));if(!c)return;const preencher=(s,valores,placeholder)=>{s.innerHTML=`<option value="">${placeholder}</option>`;valores.forEach(v=>s.add(new Option(v||'Sem virola',v)))};const configurar=l=>{l.querySelectorAll('.filtro-lote,.filtro-virola').forEach(x=>x.parentElement.remove());const p=l.querySelector('.paiol-item-select'),m=l.querySelector('.municao-select'),estoque=l.querySelector('.estoque-select');if(!p||!m||!estoque)return;const idInicial=estoque.value,dadoInicial=mapa.find(x=>x.id===idInicial),paiolInicial=p.value,municaoInicial=m.value;estoque.parentElement.classList.add('d-none');const caixaLote=document.createElement('div'),lote=document.createElement('select'),caixaVirola=document.createElement('div'),virola=document.createElement('select');caixaLote.className='col-md-2';caixaVirola.className='col-md-2';lote.className='form-select filtro-lote';virola.className='form-select filtro-virola';lote.required=true;virola.required=true;caixaLote.appendChild(lote);caixaVirola.appendChild(virola);estoque.parentElement.before(caixaLote,caixaVirola);const dados=()=>mapa.filter(x=>x.paiol===p.value&&x.municao===m.value);const lotes=()=>{const anterior=lote.value;preencher(lote,[...new Set(dados().map(x=>x.lote))],'Selecione o lote');lote.value=anterior;const anteriorVirola=virola.value;preencher(virola,lote.value?[...new Set(dados().filter(x=>x.lote===lote.value).map(x=>x.virola))]:[],'Selecione a virola');virola.value=anteriorVirola};const tipos=()=>{m.querySelectorAll('option[value]').forEach(o=>{if(o.value)o.hidden=!mapa.some(x=>x.paiol===p.value&&x.municao===o.value)});if(m.selectedOptions[0]?.hidden)m.value='';estoque.value='';estoque.disabled=true;lotes()};p.addEventListener('change',()=>{m.value='';lote.value='';virola.value='';tipos()});m.addEventListener('change',()=>{estoque.value='';estoque.disabled=true;lotes()});lote.addEventListener('change',()=>{estoque.value='';estoque.disabled=true;preencher(virola,[...new Set(dados().filter(x=>x.lote===lote.value).map(x=>x.virola))],'Selecione a virola')});virola.addEventListener('change',()=>{const d=dados().find(x=>x.lote===lote.value&&x.virola===virola.value);estoque.value=d?.id||'';estoque.disabled=!d;estoque.dispatchEvent(new Event('change',{bubbles:true}))});p.value=dadoInicial?.paiol||paiolInicial;m.value=dadoInicial?.municao||municaoInicial;tipos();if(dadoInicial){lote.value=dadoInicial.lote;lotes();virola.value=dadoInicial.virola;estoque.value=dadoInicial.id;estoque.disabled=false}};c.querySelectorAll('.item-municao').forEach(l=>setTimeout(()=>configurar(l),0));new MutationObserver(ms=>ms.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1&&n.classList.contains('item-municao'))setTimeout(()=>configurar(n),0)}))).observe(c,{childList:true})});</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('itens-municao'),principal=document.getElementById('paiol-origem'),mapa=new Map([...document.querySelectorAll('#mapa-paiois-estoque option')].map(o=>[o.value,{id:o.dataset.paiol,nome:o.textContent}]));const filtrar=l=>{const p=l.querySelector('.paiol-item-select')?.value,m=l.querySelector('.municao-select')?.value,e=l.querySelector('.estoque-select');if(!e)return;e.querySelectorAll('option[data-municao]').forEach(o=>{const origem=mapa.get(o.value);o.hidden=!p||!m||origem?.id!==p||o.dataset.municao!==m});if(![...e.options].some(o=>o.value===e.value&&!o.hidden))e.value='';e.disabled=!p||!m};const configurar=l=>{if(l.querySelector('.paiol-item-select'))return;const estoque=l.querySelector('.estoque-select'),atual=mapa.get(estoque?.value);const caixa=document.createElement('div');caixa.className='col-md-3';const p=principal.cloneNode(true);p.removeAttribute('id');p.removeAttribute('name');p.className='form-select paiol-item-select';p.required=true;p.value=atual?.id||'';caixa.appendChild(p);l.insertBefore(caixa,l.querySelector('.municao-select').parentElement);p.addEventListener('change',()=>filtrar(l));l.querySelector('.municao-select').addEventListener('change',()=>filtrar(l));filtrar(l)};c.querySelectorAll('.item-municao').forEach(configurar);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1&&n.classList.contains('item-municao'))configurar(n)}))).observe(c,{childList:true});principal.addEventListener('change',()=>{const primeira=c.querySelector('.paiol-item-select');if(primeira&&!primeira.value){primeira.value=principal.value;filtrar(primeira.closest('.item-municao'))}})});</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('itens-municao'),o=document.getElementById('oficial-detentora'),e=document.getElementById('erro-detentora');if(!c||!o)return;let seq=0;const atualizar=async()=>{const atual=++seq,selecionado=o.value,ids=[...c.querySelectorAll('.estoque-select')].map(s=>s.selectedOptions[0]?.dataset.detentora).filter(Boolean),unicos=[...new Set(ids)];if(unicos.length!==1){o.innerHTML='<option value="">Selecione primeiro os itens</option>';o.disabled=true;e.textContent=unicos.length>1?'Os itens pertencem a OMs detentoras diferentes.':'';return}e.textContent='';o.disabled=true;o.innerHTML='<option value="">Carregando responsáveis...</option>';try{const r=await fetch(`/api/militares/oficiais-municao/organizacao/${unicos[0]}`);if(!r.ok)throw new Error();const ms=await r.json();if(atual!==seq)return;o.innerHTML='<option value="">Selecione</option>';ms.forEach(m=>{const x=new Option(`${m.postoGraduacao} — ${m.nomeCompleto} — ${m.funcao} — ${m.organizacao}`,m.id);x.selected=String(m.id)===selecionado;o.add(x)});o.disabled=false;if(!ms.length)e.textContent='Nenhum Oficial de Munição ativo foi cadastrado para a OM detentora.'}catch(x){if(atual!==seq)return;o.innerHTML='<option value="">Não foi possível carregar</option>';o.disabled=true;e.textContent='Não foi possível carregar os responsáveis da OM detentora.'}};c.addEventListener('change',x=>{if(x.target.classList.contains('estoque-select'))atualizar()});new MutationObserver(atualizar).observe(c,{childList:true,subtree:true});setTimeout(atualizar,50)});</script></th:block>
