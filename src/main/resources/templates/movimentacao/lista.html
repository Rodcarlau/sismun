<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Movimentações</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Movimentações</h2>
        <div class="d-flex gap-2"><form class="d-flex gap-2" method="get" th:action="@{/relatorios/movimentacoes.pdf}" target="_blank"><input class="form-control" style="width:110px" type="number" name="ano" min="2000" max="2100" th:value="${anoAtual}" required><button class="btn btn-outline-danger" type="submit">Relatório PDF</button></form><a class="btn btn-primary" th:href="@{/movimentacoes/novo}">Nova movimentação</a></div>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>EB</th><th>DIEx</th><th>Organização solicitante</th><th>Data</th><th>Itens</th><th>Consumo</th><th>Status</th><th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movimentacao : ${movimentacoes}">
                <td th:text="${movimentacao.eb ?: '-'}">-</td><td th:text="${movimentacao.diex}">-</td><td th:text="${movimentacao.omSolicitante != null ? movimentacao.omSolicitante.sigla : '-'}">-</td>
                <td th:text="${movimentacao.dataSolicitacao}">-</td><td th:text="${#lists.size(movimentacao.itens) + ' item(ns)'}">-</td><td th:text="${consumoPorMovimentacao[movimentacao.id] != null ? consumoPorMovimentacao[movimentacao.id] : '-'}">-</td>
                <td>
                    <span class="badge" th:classappend="${movimentacao.status.name() == 'FINALIZADA' ? 'bg-success' : (movimentacao.status.name() == 'DEVOLUCAO_PENDENTE' ? 'bg-warning text-dark' : (movimentacao.status.name() == 'SOLICITADA' ? 'bg-primary' : 'bg-info text-dark'))}" th:text="${movimentacao.status}">-</span>
                </td>
                <td><a class="btn btn-sm btn-primary" th:href="@{/movimentacoes/{id}(id=${movimentacao.id})}">Detalhes</a> <a class="btn btn-sm btn-outline-secondary" th:if="${movimentacao.status.name() == 'SOLICITADA'}" th:href="@{/movimentacoes/{id}/editar(id=${movimentacao.id})}">Editar itens</a> <form class="d-inline" method="post" th:if="${movimentacao.status.name() == 'SOLICITADA' || movimentacao.status.name() == 'CANCELADA' || movimentacao.status.name() == 'RASCUNHO'}" th:action="@{/movimentacoes/{id}/excluir(id=${movimentacao.id})}" onsubmit="return confirm('Confirma a exclusão desta movimentação?')"><button class="btn btn-sm btn-outline-danger">Excluir</button></form></td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>
