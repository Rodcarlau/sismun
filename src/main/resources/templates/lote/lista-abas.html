<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-3"><h2>Lotes de Munição</h2><a class="btn btn-primary" th:href="@{/lotes/novo}">Novo lote</a></div>
<ul class="nav nav-tabs"><li class="nav-item" th:each="m,s:${municoesAbas}"><button class="nav-link" th:classappend="${s.first}?' active'" data-bs-toggle="tab" th:data-bs-target="${'#municao-'+m.id}" type="button" th:text="${m.tipoMunicao.nome+' — '+m.calibre}"></button></li></ul>
<div class="tab-content border border-top-0 p-3"><div class="tab-pane fade" th:each="m,s:${municoesAbas}" th:classappend="${s.first}?' show active'" th:id="${'municao-'+m.id}"><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Lote</th><th>Virola</th><th>Validade</th><th>OM</th><th>Ações</th></tr></thead><tbody><tr th:each="lote:${lotes}" th:if="${lote.municao != null && lote.municao.id == m.id}"><td th:text="${lote.lote}"></td><td th:text="${lote.virola}"></td><td th:text="${lote.dataValidade}"></td><td th:text="${lote.organizacaoProprietaria != null ? lote.organizacaoProprietaria.sigla : '-'}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/lotes/{id}/editar(id=${lote.id})}">Alterar</a></td></tr></tbody></table></div></div><div th:if="${#lists.isEmpty(municoesAbas)}" class="text-muted">Nenhum lote cadastrado.</div></div>
</th:block>
