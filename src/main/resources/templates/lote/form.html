<th:block th:fragment="content"><div class="page-header d-flex justify-content-between"><h2 th:text="${lote.id == null ? 'Novo lote' : 'Alterar lote'}">Lote</h2><a class="btn btn-outline-secondary" th:href="@{/lotes}">Voltar</a></div><div class="card page-card border-0"><div class="card-body">
<form th:action="@{/lotes}" th:object="${lote}" method="post" class="row g-3"><input type="hidden" th:field="*{id}">
<div class="col-md-6"><label class="form-label">Munição</label><select class="form-select" th:field="*{municao}" required><option value="">Selecione</option><option th:each="m : ${municoes}" th:value="${m.id}" th:text="${m.descricao + ' - ' + m.calibre}"></option></select></div>
<div class="col-md-3"><label class="form-label">Lote</label><input class="form-control" th:field="*{lote}" required></div><div class="col-md-3"><label class="form-label">Virola</label><input class="form-control" th:field="*{virola}"></div>
<div class="col-md-4"><label class="form-label">Validade</label><input type="date" class="form-control" th:field="*{dataValidade}" required></div><div class="col-md-6"><label class="form-label">OM proprietária</label><select class="form-select" th:field="*{organizacaoProprietaria}" required><option value="">Selecione</option><option th:each="om : ${organizacoes}" th:value="${om.id}" th:text="${om.nome}"></option></select></div><div class="col-md-2"><label class="form-label">Ativo</label><input type="checkbox" class="form-check-input ms-2" th:field="*{ativo}"></div><div class="col-12"><button class="btn btn-primary">Salvar</button></div></form>
</div></div></th:block>
