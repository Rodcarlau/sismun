<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Lotes</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Lotes de Munição</h2><a class="btn btn-primary" th:href="@{/lotes/novo}">Novo lote</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th>Munição</th>
                <th>Lote</th>
                <th>Virola</th>
                <th>Validade</th>
                <th>OM</th><th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lote : ${lotes}">
                <td th:text="${lote.municao != null ? lote.municao.descricao : '-'}">-</td>
                <td th:text="${lote.lote}">-</td>
                <td th:text="${lote.virola}">-</td>
                <td th:text="${lote.dataValidade}">-</td>
                <td th:text="${lote.organizacaoProprietaria != null ? lote.organizacaoProprietaria.nome : '-'}">-</td>
                <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/lotes/{id}/editar(id=${lote.id})}">Alterar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>
