<th:block th:fragment="content"><div class="page-header d-flex justify-content-between"><h2 th:text="${usuario.id == null ? 'Novo usuário' : 'Alterar usuário'}">Usuário</h2><a class="btn btn-outline-secondary" th:href="@{/usuarios}">Voltar</a></div><div class="card page-card border-0"><div class="card-body"><form th:action="@{/usuarios}" th:object="${usuario}" method="post" class="row g-3"><input type="hidden" th:field="*{id}"><div class="col-md-4"><label class="form-label">Nome</label><input class="form-control" th:field="*{nome}" required></div><div class="col-md-3"><label class="form-label">Usuário</label><input class="form-control" th:field="*{username}" required></div><div class="col-md-5"><label class="form-label">E-mail</label><input type="email" class="form-control" th:field="*{email}" required></div><div class="col-md-4"><label class="form-label">Senha</label><input type="password" class="form-control" th:field="*{senha}" th:required="${usuario.id == null}"><div class="form-text" th:if="${usuario.id != null}">Deixe em branco para manter a senha.</div></div><div class="col-md-6"><label class="form-label">Perfis</label><select multiple class="form-select" th:field="*{perfis}" required><option th:each="p : ${perfis}" th:value="${p.id}" th:text="${p.nome}"></option></select></div><div class="col-md-2"><label>Ativo</label><input class="form-check-input ms-2" type="checkbox" th:field="*{ativo}"></div><div class="col-12"><button class="btn btn-primary">Salvar</button></div></form></div></div></th:block>
