<th:block th:fragment="content"><div class="page-header d-flex justify-content-between"><h2 th:text="${viatura.id == null ? 'Nova viatura' : 'Alterar viatura'}">Viatura</h2><a class="btn btn-outline-secondary" th:href="@{/viaturas}">Voltar</a></div><div class="card page-card border-0"><div class="card-body"><form th:action="@{/viaturas}" th:object="${viatura}" method="post" class="row g-3"><input type="hidden" th:field="*{id}"><div class="col-md-3"><label class="form-label">Tipo</label><select class="form-select" th:field="*{tipo}" required><option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option></select></div><div class="col-md-3"><label class="form-label">Modelo</label><input class="form-control" th:field="*{modelo}" required></div><div class="col-md-2"><label class="form-label">Placa</label><input class="form-control" th:field="*{placa}" required></div><div class="col-md-2"><label class="form-label">Prefixo</label><input class="form-control" th:field="*{prefixo}" required></div><div class="col-md-6"><label class="form-label">OM pertencente</label><select class="form-select" th:field="*{organizacaoMilitar}" required><option th:each="om : ${organizacoes}" th:value="${om.id}" th:text="${om.nome}"></option></select></div><div class="col-md-2"><label>Ativa</label><input class="form-check-input ms-2" type="checkbox" th:field="*{ativo}"></div><div class="col-12"><button class="btn btn-primary">Salvar</button></div></form></div></div></th:block>
